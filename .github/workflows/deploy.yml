name: SmartCanteen CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: smartcanteen-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Check, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m venv .venv
          source .venv/bin/activate

          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest

      - name: Check backend syntax
        shell: bash
        run: |
          set -euo pipefail

          source .venv/bin/activate

          if [ -d "backend" ]; then
            python -m compileall -q backend
          else
            echo "backend folder not found."
            exit 1
          fi

      - name: Run backend tests if available
        shell: bash
        run: |
          set -euo pipefail

          source .venv/bin/activate

          mapfile -t test_files < <(find backend tests -type f \( -name "test_*.py" -o -name "*_test.py" \) 2>/dev/null || true)

          if [ "${#test_files[@]}" -gt 0 ]; then
            python -m pytest "${test_files[@]}"
          else
            echo "No backend test files found. Skipping backend tests."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: smartcanteen/package-lock.json

      - name: Install frontend dependencies
        working-directory: smartcanteen
        run: npm ci

      - name: Run frontend lint
        working-directory: smartcanteen
        run: npm run lint --if-present

      - name: Run frontend tests if available
        working-directory: smartcanteen
        shell: bash
        run: |
          set -euo pipefail

          if node -e "const pkg=require('./package.json'); process.exit(pkg.scripts && pkg.scripts.test ? 0 : 1)"; then
            CI=true npm test
          else
            echo "No frontend test script found. Skipping frontend tests."
          fi

      - name: Build frontend
        working-directory: smartcanteen
        run: npm run build

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
        run: |
          set -euo pipefail

          missing=0

          for secret_name in SERVER_HOST SERVER_USER SERVER_SSH_KEY PROJECT_PATH; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing required GitHub secret: ${secret_name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "All required secrets exist."

      - name: Deploy to EC2 Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
          BACKEND_SERVICE_NAME: ${{ secrets.BACKEND_SERVICE_NAME }}
          NGINX_SERVICE_NAME: ${{ secrets.NGINX_SERVICE_NAME }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: PROJECT_PATH,BACKEND_SERVICE_NAME,NGINX_SERVICE_NAME,HEALTHCHECK_URL
          script_stop: true
          script: |
            set -e

            echo "Connected to server."
            echo "Checking project directory: $PROJECT_PATH"

            if [ -z "$PROJECT_PATH" ]; then
              echo "PROJECT_PATH is empty."
              exit 1
            fi

            if [ ! -d "$PROJECT_PATH" ]; then
              echo "Project folder does not exist: $PROJECT_PATH"
              exit 1
            fi

            cd "$PROJECT_PATH"

            echo "Current directory:"
            pwd

            echo "Checking git repository..."
            if [ ! -d ".git" ]; then
              echo "This folder is not a git repository: $PROJECT_PATH"
              exit 1
            fi

            echo "Pulling latest code from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "Checking deployment script..."
            if [ ! -f "scripts/deploy.sh" ]; then
              echo "Missing deployment script: scripts/deploy.sh"
              exit 1
            fi

            backend_service="${BACKEND_SERVICE_NAME:-smartcanteen}"
            nginx_service="${NGINX_SERVICE_NAME:-nginx}"
            healthcheck_url="${HEALTHCHECK_URL:-http://127.0.0.1:8000/api/health}"

            echo "Backend service: $backend_service"
            echo "Nginx service: $nginx_service"
            echo "Healthcheck URL: $healthcheck_url"

            echo "Running deployment script..."

            SMARTCANTEEN_APP_DIR="$PROJECT_PATH" \
            SMARTCANTEEN_BRANCH="main" \
            SMARTCANTEEN_BACKEND_SERVICE="$backend_service" \
            SMARTCANTEEN_NGINX_SERVICE="$nginx_service" \
            SMARTCANTEEN_HEALTHCHECK_URL="$healthcheck_url" \
              bash scripts/deploy.sh

            echo "Deployment completed successfully."